<!doctype html>
<html lang="en" class="dark">
  <!-- default to dark; hydrated by inline script below -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700;800&amp;display=swap"
    />
    <title>Reussir Playground</title>
  </head>
  <body>
    <script>
      try {
        const t = JSON.parse(localStorage.getItem("theme") || '"dark"');
        if (t === "light") document.documentElement.classList.remove("dark");
      } catch {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
