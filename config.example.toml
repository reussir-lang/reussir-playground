# Reussir Playground — example configuration
# Copy to config.toml and adjust for your environment.

bind_addr = "127.0.0.1:3000"

[compiler]
# Nightly toolchain binaries from:
# https://github.com/reussir-lang/reussir/releases/tag/nightly
rrc_path = "/path/to/reussir-nightly/bin/rrc"
rene_path = "/path/to/reussir-nightly/bin/rene"

# LLVM's WebAssembly-aware strip tool.
llvm_strip_path = "/path/to/llvm-strip"

# Optional absolute overrides; otherwise resolved from PATH.
# rustc_path = "/path/to/rustc"
# cargo_path = "/path/to/cargo"

# Rene caches its baked wasm32-wasip1 runtime and build records here.
build_dir = "playground-build"

# Optional writable Cargo cache used while Rene bakes its embedded runtime.
# Defaults to <build_dir>/cargo-home.
# cargo_home = "playground-build/cargo-home"

# Additional read-only roots required inside the compiler sandbox.
# Docker uses this for its rustup/Cargo installations.
toolchain_ro_paths = []

compile_timeout_secs = 30
build_timeout_secs = 300

[sandbox]
# "bwrap", "landlock", or "none". Use "none" for local macOS development.
kind = "none"

# Optional: explicit path to bubblewrap.
# bwrap_path = "/usr/bin/bwrap"
